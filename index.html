/* ---------- VOCE MASCHILE ---------- */
var MASC=["luca","giorgio","diego","cosimo","marco","paolo","stefano","roberto","claudio","matteo"];
var FEM=["alice","elsa","federica","paola","silvia","carla","chiara","emma","isabella","bianca","giulia","laura","lucia","sara","valentina","anna","eloisa"];
function scegliVoce(){
  var vs=speechSynthesis.getVoices().filter(function(x){return x.lang.replace("_","-").toLowerCase().indexOf("it")===0;});
  var i,j;
  for(i=0;i<MASC.length;i++){for(j=0;j<vs.length;j++){if(vs[j].name.toLowerCase().indexOf(MASC[i])>=0)return {v:vs[j],maschio:true};}}
  for(j=0;j<vs.length;j++){
    var n=vs[j].name.toLowerCase(),f=false;
    for(i=0;i<FEM.length;i++){if(n.indexOf(FEM[i])>=0)f=true;}
    if(!f)return {v:vs[j],maschio:true};
  }
  return {v:vs[0],maschio:false};
}

function fermaRec(){
  if(rec){rec.onstart=null;rec.onresult=null;rec.onend=null;rec.onerror=null;try{rec.abort();}catch(e){}rec=null;}
}

/* ---------- PARLARE E INTERROMPERE ---------- */
function interrompi(){
  parlaTok++;clearTimeout(timerFine);
  try{speechSynthesis.cancel();}catch(e){}
  speaking=false;svegliaFino=Date.now()+20000;
  setMode("ascolto");stat("Ti ascolto…");
  if(running&&!rec)setTimeout(avvia,200);
}

function parla(t){
  occupato=false;
  agg(t,"j");speaking=true;setMode("parla");
  stat(bargeIn?"Sto parlando… di’ “Junior” o tocca il nucleo per interrompermi":"Sto parlando…");
  if(!bargeIn)fermaRec();else if(!rec&&running)setTimeout(avvia,500);
  var tok=++parlaTok;
  var u=new SpeechSynthesisUtterance(t);u.lang="it-IT";
  var ve=scegliVoce();if(ve.v)u.voice=ve.v;
  u.pitch=ve.maschio?0.95:0.7;u.rate=1.0;u.volume=1;
  var done=false;
  var fine=function(){
    if(done||tok!==parlaTok)return;done=true;clearTimeout(timerFine);
    speaking=false;svegliaFino=Date.now()+20000;
    if(running){setMode("ascolto");stat("In ascolto…");if(!rec)setTimeout(avvia,500);}else{setMode("idle");}
  };
  u.onend=fine;
  u.onerror=function(e){
    if(tok!==parlaTok)return;
    if(e&&e.error&&e.error!=="interrupted"&&e.error!=="canceled")stat("Errore voce: "+e.error+" (controlla volume e tasto silenzioso)");
    fine();
  };
  clearTimeout(timerFine);
  timerFine=setTimeout(fine,Math.max(3500,t.length*80+3000));
  try{speechSynthesis.cancel();speechSynthesis.speak(u);speechSynthesis.resume();}catch(e){stat("Errore voce: "+e.message);fine();}
}

/* ---------- INTERNET ---------- */
function keywords(q){
  return q.toLowerCase().split(/[^a-zàèéìòóù0-9]+/).filter(function(w){return w&&w.length>1&&STOP.indexOf(w)<0;}).join(" ");
}

function pulisciTesto(t){
  return t.replace(/\([^)]*\)/g,"").replace(/\[[^\]]*\]/g,"")
   .replace(/\ba\.\s?C\./g,"avanti Cristo").replace(/\bd\.\s?C\./g,"dopo Cristo")
   .replace(/\b([A-ZÀ-Ý])\.\s?/g,"$1 ").replace(/\s+/g," ").trim();
}

function dividi(t){
  t=pulisciTesto(t);
  var m=t.match(/[^.!?]+[.!?]+(?=\s|$)/g);
  if(!m)return t?[t]:[];
  return m.map(function(s){return s.trim();}).filter(Boolean);
}

function leggi(){
  var u=ultimo,out="",n=0;
  while(u.i<u.f.length&&n<4&&(n===0||out.length+u.f[u.i].length<520)){out+=(out?" ":"")+u.f[u.i];u.i++;n++;}
  if(u.i<u.f.length)out+=" Se vuoi saperne di più, di’ continua.";
  return out;
}

function wikiTenta(q){
  var url="https://it.wikipedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrsearch="+encodeURIComponent(q)+"&gsrlimit=5&prop=extracts&exintro=1&explaintext=1&exlimit=max";
  return fetch(url).then(function(r){return r.json();}).then(function(d){
    if(!d.query||!d.query.pages)return null;
    var ps=Object.keys(d.query.pages).map(function(k){return d.query.pages[k];}).filter(function(p){return p.extract&&p.extract.length>40;});
    if(!ps.length)return null;
    var kw=keywords(q).split(" ").filter(Boolean);
    ps.forEach(function(p){
      var ti=p.title.toLowerCase(),ex=p.extract.toLowerCase(),s=0;
      kw.forEach(function(w){if(ti.indexOf(w)>=0)s+=3;else if(ex.indexOf(w)>=0)s+=1;});
      if(/può (riferirsi|indicare|significare)|può essere/.test(ex.slice(0,200)))s-=4;
      s-=(p.index||0)*0.1;
      p._s=s;
    });
    ps.sort(function(a,b){return b._s-a._s;});
    return ps[0];
  });
}

function pulisci(c){
  return c
   .replace(/^(per favore|dimmi|puoi dirmi|sai dirmi|mi dici|dammi informazioni su|parlami di|raccontami di|raccontami|spiegami|cerca|cercami)\s+/,"")
   .replace(/^(come funziona(no)?|come si (fa|fanno|prepara|preparano|chiama|chiamano)|chi (è|era|sono|erano)|che cos['’]è|cos['’]è|cosa (è|sono)|che cosa (è|sono)|cosa significa|che significa|cosa vuol dire|qual è|quale è|quali sono|dove si trova|dov['’]è|di cosa si tratta|perché|quando (è|era|nacque|morì))\s+/,"")
   .replace(/^(il|lo|la|l['’]|un|una|i|gli|le)\s*/,"")
   .replace(/[?!.]+$/,"").trim();
}

function rispondiWeb(c){
  var q=pulisci(c);if(!q)q=c;
  occupato=true;stat("Cerco online: "+q+"…");
  var tentativi=[q],k=keywords(q);
  if(k&&k!==q)tentativi.push(k);
  var i=0;
  function trovato(p){
    ultimo={t:p.title,f:dividi(p.extract),i:0};
    link("Leggi di più: "+p.title,"https://it.wikipedia.org/wiki/"+encodeURIComponent(p.title.replace(/ /g,"_")));
    parla("Ecco cosa ho trovato su "+p.title+". "+leggi());
  }
  function fallimento(){
    link("Cerca su Google: "+q,"https://www.google.com/search?q="+encodeURIComponent(q));
    parla("Non ho trovato nulla di preciso su "+q+". Prova a chiedermelo con altre parole, o con il nome esatto.");
  }
  function prova(){
    if(i>=tentativi.length)return fallimento();
    return wikiTenta(tentativi[i++]).then(function(p){return p?trovato(p):prova();});
  }
  prova().catch(function(){parla("Non riesco a collegarmi a internet.");});
}

function curiosita(){
  occupato=true;stat("Cerco una curiosità…");
  fetch("https://it.wikipedia.org/api/rest_v1/page/random/summary").then(function(r){return r.json();}).then(function(d){
    ultimo={t:d.title,f:dividi(d.extract||""),i:0};
    link("Leggi di più: "+d.title,"https://it.wikipedia.org/wiki/"+encodeURIComponent(d.title.replace(/ /g,"_")));
    parla("Lo sapevi? "+d.title+". "+leggi());
  }).catch(function(){parla("Non riesco a collegarmi a internet.");});
}

function descr(k){
  if(k===0)return "cielo sereno";
  if(k<=2)return "poco nuvoloso";
  if(k===3)return "cielo coperto";
  if(k===45||k===48)return "nebbia";
  if(k>=51&&k<=57)return "pioggerella";
  if(k>=61&&k<=67)return "pioggia";
  if(k>=71&&k<=77)return "neve";
  if(k>=80&&k<=82)return "rovesci";
  if(k>=95)return "temporale";
  return "tempo variabile";
}

function meteo(citta){
  occupato=true;stat("Controllo il meteo a "+citta+"…");
  fetch("https://geocoding-api.open-meteo.com/v1/search?name="+encodeURIComponent(citta)+"&count=1&language=it&format=json")
  .then(function(r){return r.json();}).then(function(g){
    if(!g.results||!g.results.length){return parla("Non trovo la città "+citta+".");}
    var p=g.results[0];
    return fetch("https://api.open-meteo.com/v1/forecast?latitude="+p.latitude+"&longitude="+p.longitude+"&current=temperature_2m,weather_code,wind_speed_10m&timezone=auto")
    .then(function(r){return r.json();}).then(function(w){
      var k=w.current;
      parla("A "+p.name+" la temperatura è di "+Math.round(k.temperature_2m)+" gradi, "+descr(k.weather_code)+". Vento a "+Math.round(k.wind_speed_10m)+" chilometri orari.");
    });
  }).catch(function(){parla("Non riesco a controllare il meteo, forse manca internet.");});
}

/* ---------- MATEMATICA ---------- */
function N(s){return parseFloat(String(s).replace(",","."));}
function nums(c){var m=c.match(/\d+(?:[.,]\d+)?/g);return m?m.map(N):[];}
function F(x){x=Math.round(x*1e6)/1e6;return String(x).replace(".",",");}
function mcdf(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=b;b=a%b;a=t;}return a;}

function matematica(c){
  var n=nums(c),m,x;
  var NUM="(\\d+(?:[.,]\\d+)?)";
  if((m=c.match(new RegExp(NUM+"\\s*(?:per cento|percento|%)\\s*di\\s*"+NUM))))return "Il "+m[1]+" per cento di "+m[2]+" è "+F(N(m[1])*N(m[2])/100)+".";
  if(/radice quadrata/.test(c)&&n.length)return "La radice quadrata di "+F(n[0])+" è "+F(Math.sqrt(n[0]))+".";
  if(/radice cubica/.test(c)&&n.length)return "La radice cubica di "+F(n[0])+" è "+F(Math.cbrt(n[0]))+".";
  if(/al quadrato/.test(c)&&n.length)return F(n[0])+" al quadrato fa "+F(n[0]*n[0])+".";
  if(/al cubo/.test(c)&&n.length)return F(n[0])+" al cubo fa "+F(Math.pow(n[0],3))+".";
  if((m=c.match(new RegExp(NUM+"\\s*(?:elevato\\s+alla|elevato\\s+a|alla)\\s*"+NUM))))return F(N(m[1]))+" elevato alla "+F(N(m[2]))+" fa "+F(Math.pow(N(m[1]),N(m[2])))+".";
  if(/fattoriale/.test(c)&&n.length){
    if(n[0]>20||n[0]<0||n[0]%1)return "Posso calcolare il fattoriale dei numeri interi da zero a venti.";
    var f=1;for(x=2;x<=n[0];x++)f*=x;return "Il fattoriale di "+n[0]+" è "+f+".";
  }
  if((m=c.match(/(\d+)\s+è\s+(?:un\s+numero\s+)?primo/))){
    var p=+m[1],pr=p>1;for(x=2;x*x<=p;x++){if(p%x===0){pr=false;break;}}
    return p+(pr?" è un numero primo.":" non è un numero primo.");
  }
  if(/(mcd|massimo comun divisore)/.test(c)&&n.length>=2)return "Il massimo comun divisore tra "+n[0]+" e "+n[1]+" è "+mcdf(n[0],n[1])+".";
  if(/(mcm|minimo comune multiplo)/.test(c)&&n.length>=2)return "Il minimo comune multiplo tra "+n[0]+" e "+n[1]+" è "+(n[0]*n[1]/mcdf(n[0],n[1]))+".";
  if(/area del cerchio/.test(c)&&n.length)return "L’area del cerchio di raggio "+F(n[0])+" è "+F(Math.PI*n[0]*n[0])+".";
  if(/circonferenza/.test(c)&&n.length)return "La circonferenza di raggio "+F(n[0])+" misura "+F(2*Math.PI*n[0])+".";
  if(/area del quadrato/.test(c)&&n.length)return "L’area del quadrato di lato "+F(n[0])+" è "+F(n[0]*n[0])+".";
  if(/area del rettangolo/.test(c)&&n.length>=2)return "L’area del rettangolo è "+F(n[0]*n[1])+".";
  if(/area del triangolo/.test(c)&&n.length>=2)return "L’area del triangolo è "+F(n[0]*n[1]/2)+".";
  if(/perimetro del quadrato/.test(c)&&n.length)return "Il perimetro del quadrato è "+F(4*n[0])+".";
  if(/perimetro del rettangolo/.test(c)&&n.length>=2)return "Il perimetro del rettangolo è "+F(2*(n[0]+n[1]))+".";
  if(/ipotenusa/.test(c)&&n.length>=2)return "L’ipotenusa misura "+F(Math.sqrt(n[0]*n[0]+n[1]*n[1]))+".";
  if(/volume del cubo/.test(c)&&n.length)return "Il volume del cubo è "+F(Math.pow(n[0],3))+".";
  if(/volume della sfera/.test(c)&&n.length)return "Il volume della sfera è "+F(4/3*Math.PI*Math.pow(n[0],3))+".";
  if((m=c.match(new RegExp(NUM+"\\s*gradi\\s*(celsius|centigradi|fahrenheit).*?(celsius|centigradi|fahrenheit)")))){
    var v=N(m[1]),da=m[2]==="fahrenheit",a=m[3]==="fahrenheit";
    if(!da&&a)return F(v)+" gradi Celsius sono "+F(v*9/5+32)+" gradi Fahrenheit.";
    if(da&&!a)return F(v)+" gradi Fahrenheit sono "+F((v-32)*5/9)+" gradi Celsius.";
  }
  if((m=c.match(/(\d+)\s+in\s+(binario|esadecimale)/)))return m[1]+" in "+m[2]+" si scrive "+(m[2]==="binario"?(+m[1]).toString(2):(+m[1]).toString(16).toUpperCase())+".";
  var s=c.replace(/quanto fa|quanto viene|calcola|fammi il calcolo di|quant['’]è/g,"")
   .replace(/\bpiù\b/g,"+").replace(/\bmeno\b/g,"-").replace(/\b(diviso|fratto)\b/g,"/").replace(/\b(per|volte|x)\b/g,"*")
   .replace(/(\d)\s*,\s*(\d)/g,"$1.$2").replace(/\s+/g,"");
  if(/^[\d+\-*\/().]+$/.test(s)&&/[+\-*\/]/.test(s)&&/\d/.test(s)){
    try{var r=Function('"use strict";return ('+s+')')();if(typeof r==="number"&&isFinite(r))return "Fa "+F(r)+".";}catch(e){}
  }
  return null;
}

/* ---------- COMANDI ---------- */
function esegui(c,silenzioso){
  var o=new Date(),m;
  c=c.trim();if(!c)return;
  if(/^(continua|vai avanti|prosegui|dimmi di più|di più|altro|ancora)$/.test(c)&&ultimo&&ultimo.i<ultimo.f.length)return parla(leggi());
  if(silenzioso&&c.split(" ").length<2)return;
  if(/\b(esci|stop|spegniti|arrivederci)\b/.test(c)){running=false;orb.textContent="AVVIA";parla("Ok, a dopo! Chiamami quando vuoi.");return;}
  if(/^(ciao|ehi|hey|salve)\b/.test(c))return parla("Ehi! Che si dice? Dimmi tutto!");
  if(/come stai/.test(c))return parla("Alla grande! Sono carico a mille. E tu?");
  if(/come ti chiami|chi sei/.test(c))return parla("Sono il tuo assistente vocale, il più figo in circolazione!");
  if(/\bgrazie\b/.test(c))return parla("Figurati! Quando vuoi.");
  if(/che ore sono|che ora è/.test(c))return parla("Sono le "+o.getHours()+" e "+("0"+o.getMinutes()).slice(-2)+". Il tempo vola!");
  if(/che giorno|data di oggi/.test(c))return parla("Oggi è "+GIORNI[o.getDay()]+" "+o.getDate()+" "+MESI[o.getMonth()]+" "+o.getFullYear());
  if(/\bbarzelletta\b/.test(c))return parla(BARZ[Math.floor(Math.random()*BARZ.length)]);
  if(/\bdado\b/.test(c))return parla("Ho tirato il dado ed è uscito "+(Math.floor(Math.random()*6)+1)+"!");
  if(/\bmoneta\b/.test(c))return parla(Math.random()<0.5?"Testa!":"Croce!");
  if(/curiosit|sapevi che|qualcosa di interessante/.test(c))return curiosita();
  if(/apri youtube/.test(c)){link("Apri YouTube","https://www.youtube.com");return parla("Ecco YouTube! Tocca il link.");}
  m=c.match(/^(riproduci|metti|suona)\s+(.+)/);
  if(m){link("Cerca "+m[2]+" su YouTube","https://www.youtube.com/results?search_query="+encodeURIComponent(m[2]));return parla("Ti cerco "+m[2]+" su YouTube! Tocca il link.");}
  m=c.match(/^(?:cerca|cercami)\s+(?:su\s+)?google\s+(.+)/);
  if(m){link("Cerca "+m[1]+" su Google","https://www.google.com/search?q="+encodeURIComponent(m[1]));return parla("Ecco la ricerca su Google! Tocca il link.");}

  var cc=c.replace(/\bun(a)?\s+(?=(second|minut|or))/,"1 ");
  m=cc.match(/(\d+)\s*(second|minut|or)/);
  if(/timer|conto alla rovescia|sveglia/.test(c)&&m){
    var n=+m[1],u=m[2],ms=n*(u==="second"?1000:u==="minut"?60000:3600000);
    var nome=n+(u==="second"?" secondi":u==="minut"?" minuti":" ore");
    setTimeout(function(){parla("Ehi! Il timer da "+nome+" è scaduto!");},ms);
    return parla("Ok, timer da "+nome+" partito! Tieni la pagina aperta.");
  }

  if(/\b(meteo|tempo fa|temperatura|piove|previsioni)\b/.test(c)&&!/gradi/.test(c)){
    var mm=c.match(/(?:meteo|tempo|temperatura|piove|previsioni).*?\b(?:a|ad|di|in|per|su)\s+(.+?)(?:\s+(?:oggi|adesso|ora|domani|stasera))?$/);
    var citta=mm?mm[1]:null;
    if(!citta){var x=c.match(/^(?:meteo|previsioni)\s+(.+)/);if(x)citta=x[1];}
    if(!citta){
      attesaFn=function(t){meteo(t.replace(/^(a|ad|di|in)\s+/,""));};
      return parla("Di quale città vuoi il meteo?");
    }
    return meteo(citta);
  }

  var mt=matematica(c);
  if(mt)return parla(mt);

  var def=/cos['’]è|cosa è|cosa sono|che cos|spiegami|definizione|significa|vuol dire|parlami|come funziona|a cosa serve|differenza/.test(c)||c.split(" ").length<=3;
  if(def){for(var q=0;q<KB.length;q++){if(KB[q][0].test(c))return parla(KB[q][1]);}}

  if(/significa|sinonimo|contrario di|definizione di/.test(c)){
    var par=c.replace(/^.*(?:significa|sinonimo di|contrario di|definizione di)\s+/,"").replace(/[?!.]+$/,"").split(" ")[0];
    if(par)link("Vocabolario: "+par,"https://it.wiktionary.org/wiki/"+encodeURIComponent(par));
  }
  rispondiWeb(c);
}

function elabora(t){
  if(occupato)return;
  agg(t,"t");
  if(attesaFn){var f=attesaFn;attesaFn=null;return f(t);}
  var m=t.match(WAKE);
  if(m){
    var c=t.slice(m.index+m[0].length).replace(/^[\s,.]+/,"");
    if(!c){attesaFn=esegui;parla("Dimmi!");}else esegui(c);
  }else if(Date.now()<svegliaFino){
    esegui(t,true);
  }
}

function avvia(){
  if(!running||occupato||(speaking&&!bargeIn))return;
  fermaRec();
  try{
    rec=new SR();rec.lang="it-IT";rec.continuous=false;rec.interimResults=true;
    ultimaAttivita=Date.now();
    rec.onstart=function(){
      ultimaAttivita=Date.now();
      if(speaking)return;
      setMode("ascolto");
      stat(Date.now()<svegliaFino?"Ti ascolto… continua pure, senza dire “Junior”":"In ascolto… di’ “Junior”");
    };
    rec.onresult=function(ev){
      ultimaAttivita=Date.now();
      if(occupato)return;
      for(var i=ev.resultIndex;i<ev.results.length;i++){
        var t=ev.results[i][0].transcript.toLowerCase().trim();
        if(speaking){
          if(WAKE.test(t)||/^(basta|fermati|zitto|silenzio)\b/.test(t))interrompi();else continue;
        }
        if(ev.results[i].isFinal)elabora(t);else stat("Sento: "+t);
      }
    };
    rec.onend=function(){if(running&&!occupato&&(!speaking||bargeIn))setTimeout(avvia,300);};
    rec.onerror=function(e){
      var msg=null;
      if(e.error==="service-not-allowed")msg="Attiva la dettatura: Impostazioni > Generali > Tastiera > Abilita dettatura (e controlla che Siri sia attivo).";
      else if(e.error==="not-allowed")msg="Microfono bloccato. Consenti il microfono per questo sito nelle impostazioni di Safari.";
      else if(e.error==="network")msg="Serve una connessione internet.";
      if(msg){stat(msg);running=false;setMode("idle");orb.textContent="AVVIA";}
    };
    rec.start();
  }catch(e){stat("Microfono: "+e.message);}
}

setInterval(function(){
  if(running&&!occupato&&(!speaking||bargeIn)&&Date.now()-ultimaAttivita>8000)avvia();
},2000);

orb.addEventListener("click",function(){
  if(!SR){stat("Questo browser non supporta il riconoscimento vocale. Usa Safari o Chrome.");return;}
  if(running&&speaking){interrompi();return;}
  try{var u=new SpeechSynthesisUtterance(" ");u.volume=0;speechSynthesis.speak(u);}catch(e){}
  if(running){running=false;fermaRec();setMode("idle");orb.textContent="AVVIA";stat("");return;}
  running=true;orb.textContent="STOP";
  avvia();
});

$("test").addEventListener("click",function(){
  parla("Yo! Eccomi. Se mi senti, la voce funziona alla grande!");
  var ve=scegliVoce();
  setTimeout(function(){stat("Voce: "+(ve.v?ve.v.name:"predefinita")+(ve.maschio?" (maschile)":" (nessuna voce maschile trovata: scarica Luca nelle impostazioni)"));},120);
});
$("bi").addEventListener("click",function(){
  bargeIn=!bargeIn;this.textContent="✋ INTERRUZIONE: "+(bargeIn?"ON":"OFF");
  stat(bargeIn?"Puoi interrompermi dicendo Junior.":"Interruzione vocale spenta: tocca il nucleo per interrompermi.");
});
$("invia").addEventListener("click",function(){var v=$("testo").value.toLowerCase().trim();if(v){agg(v,"t");$("testo").value="";esegui(v.replace(/^junior[\s,.]*/,""));}});
var chips=document.querySelectorAll(".chip[data-c]");
for(var k=0;k<chips.length;k++){chips[k].addEventListener("click",function(){esegui(this.getAttribute("data-c"));});}
if(window.speechSynthesis)speechSynthesis.getVoices();
</script>

<title>Junior</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:#fff;font-family:-apple-system,system-ui,"Segoe UI",sans-serif;background:radial-gradient(circle at 50% 0%,#3b1d8f 0%,#12082e 45%,#07041a 100%);display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 20px) 16px 24px}
h1{margin:6px 0 0;font-size:2.4rem;letter-spacing:2px;background:linear-gradient(90deg,#22d3ee,#a78bfa,#f472b6);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin:4px 0 22px;color:#b9a9ff;text-align:center}
#orb{width:170px;height:170px;border-radius:50%;border:0;color:#fff;font-size:1.15rem;font-weight:800;letter-spacing:1px;background:radial-gradient(circle at 35% 30%,#a78bfa,#5b21b6 70%);box-shadow:0 0 40px #7c3aed88;transition:.3s}
body[data-mode="ascolto"] #orb{background:radial-gradient(circle at 35% 30%,#67e8f9,#0891b2 70%);animation:pulsa 1.4s infinite}
body[data-mode="parla"] #orb{background:radial-gradient(circle at 35% 30%,#f9a8d4,#db2777 70%);animation:pulsa .6s infinite}
@keyframes pulsa{0%{box-shadow:0 0 0 0 #22d3ee99,0 0 40px #22d3ee66}70%{box-shadow:0 0 0 40px #22d3ee00,0 0 60px #22d3ee66}100%{box-shadow:0 0 0 0 #22d3ee00,0 0 40px #22d3ee66}}
#stato{margin:22px 0 10px;color:#c4b5fd;min-height:1.4em;text-align:center;max-width:520px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:560px;margin-bottom:14px}
.chip{border:1px solid #7c3aed;background:#1e1146;color:#e9e3ff;border-radius:999px;padding:9px 14px;font-size:.95rem}
.riga{display:flex;gap:8px;width:100%;max-width:560px;margin-bottom:14px}
#testo{flex:1;border-radius:14px;border:1px solid #4c1d95;background:#150b38;color:#fff;padding:12px;font-size:1rem}
.riga button{border:0;border-radius:14px;background:#7c3aed;color:#fff;padding:0 18px;font-weight:700}
#log{width:100%;max-width:560px;display:flex;flex-direction:column;gap:8px}
.m{padding:10px 14px;border-radius:16px;max-width:88%}
.j{align-self:flex-start;background:#2a1565;border:1px solid #6d28d9}
.t{align-self:flex-end;background:#083344;border:1px solid #0891b2}
</style>
</head>

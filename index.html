<style>
*{box-sizing:border-box}
:root{--c:#22d3ee;--v:#a78bfa;--m:#f472b6;--bg:#02060f}
body{margin:0;min-height:100vh;color:#d8f6ff;font-family:"Rajdhani",-apple-system,system-ui,sans-serif;font-size:1.05rem;background:
 radial-gradient(circle at 50% 28%,#0b2a4a 0%,#041226 40%,var(--bg) 75%);
 display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 28px;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.35;
 background-image:linear-gradient(#22d3ee22 1px,transparent 1px),linear-gradient(90deg,#22d3ee22 1px,transparent 1px);
 background-size:44px 44px;-webkit-mask-image:radial-gradient(circle at 50% 35%,#000 20%,transparent 75%);mask-image:radial-gradient(circle at 50% 35%,#000 20%,transparent 75%)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:5;opacity:.18;
 background:repeating-linear-gradient(0deg,#000 0,#000 1px,transparent 1px,transparent 3px)}
body>*{position:relative;z-index:1}
.hud{width:100%;max-width:620px;display:flex;justify-content:space-between;align-items:center;font-family:"Orbitron",sans-serif;font-size:.68rem;letter-spacing:2px;color:#67e8f9;border-bottom:1px solid #22d3ee55;padding-bottom:8px}
.hud b{color:#fff;font-weight:700}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#34d399;box-shadow:0 0 10px #34d399;margin-right:6px;animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.25}}
h1{margin:18px 0 0;font-family:"Orbitron",sans-serif;font-weight:900;font-size:2.5rem;letter-spacing:10px;padding-left:10px;color:#fff;text-shadow:0 0 12px var(--c),0 0 32px #22d3ee88}
.ver{font-family:"Orbitron",sans-serif;font-size:.62rem;letter-spacing:3px;color:#38bdf8aa;margin:4px 0 0}
.sub{margin:10px 0 8px;color:#8fd8ee;text-align:center;max-width:460px}
#err{display:none;background:#7f1d1d;color:#fff;padding:10px 14px;margin-bottom:12px;max-width:560px;font-size:.9rem;clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
.core{position:relative;width:250px;height:250px;display:grid;place-items:center;margin:8px 0}
.ring{position:absolute;border-radius:50%;pointer-events:none}
.r1{inset:0;border:2px solid transparent;border-top-color:var(--c);border-bottom-color:#22d3ee44;animation:spin 7s linear infinite;filter:drop-shadow(0 0 6px var(--c))}
.r2{inset:18px;border:2px solid transparent;border-left-color:var(--v);border-right-color:#a78bfa44;animation:spin 4.5s linear infinite reverse;filter:drop-shadow(0 0 6px var(--v))}
.r3{inset:36px;border:1px dashed #22d3ee77;animation:spin 24s linear infinite}
.r4{inset:-10px;border:1px solid #22d3ee22;box-shadow:0 0 40px #22d3ee22 inset}
@keyframes spin{to{transform:rotate(360deg)}}
#orb{position:relative;width:148px;height:148px;border-radius:50%;border:1px solid #67e8f9;color:#e6fbff;font-family:"Orbitron",sans-serif;font-weight:700;font-size:1rem;letter-spacing:3px;cursor:pointer;
 background:radial-gradient(circle at 50% 38%,#0e7490 0%,#083047 55%,#041a2b 100%);box-shadow:0 0 28px #22d3ee66,inset 0 0 28px #22d3ee44;transition:background .4s,box-shadow .4s,border-color .4s}
body[data-mode="ascolto"]{--c:#34d399}
body[data-mode="ascolto"] #orb{border-color:#6ee7b7;background:radial-gradient(circle at 50% 38%,#047857 0%,#06402f 55%,#03221a 100%);box-shadow:0 0 36px #34d39988,inset 0 0 28px #34d39955;animation:respira 1.6s ease-in-out infinite}
body[data-mode="parla"]{--c:#f472b6;--v:#fb7185}
body[data-mode="parla"] #orb{border-color:#f9a8d4;background:radial-gradient(circle at 50% 38%,#9d174d 0%,#500a2a 55%,#2a0517 100%);box-shadow:0 0 40px #f472b699,inset 0 0 28px #f472b666;animation:respira .6s ease-in-out infinite}
body[data-mode="parla"] .r1{animation-duration:2.2s}
body[data-mode="parla"] .r2{animation-duration:1.6s}
body[data-mode="ascolto"] .r1{animation-duration:4s}
@keyframes respira{50%{transform:scale(1.07)}}
#modo{font-family:"Orbitron",sans-serif;font-size:.72rem;letter-spacing:4px;color:var(--c);text-shadow:0 0 8px var(--c);margin-top:2px}
#stato{margin:10px 0 14px;color:#9fe3f5;min-height:1.4em;text-align:center;max-width:520px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:600px;margin-bottom:14px}
.chip{font-family:"Rajdhani",sans-serif;font-weight:600;font-size:1rem;letter-spacing:1px;color:#c9f4ff;background:linear-gradient(135deg,#0a2a40,#071a2c);border:0;padding:10px 16px;cursor:pointer;
 clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);box-shadow:0 0 0 1px #22d3ee88 inset}
.chip:active{background:#0e5a7a}
.riga{display:flex;gap:8px;width:100%;max-width:600px;margin-bottom:16px}
#testo{flex:1;min-width:0;border:1px solid #22d3ee66;background:#04162a;color:#e6fbff;padding:12px 14px;font-family:"Rajdhani",sans-serif;font-size:1.05rem;outline:none;
 clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
#testo:focus{box-shadow:0 0 14px #22d3ee66}
.riga button{border:0;background:linear-gradient(135deg,#0891b2,#0e7490);color:#fff;padding:0 20px;font-family:"Orbitron",sans-serif;font-size:.75rem;letter-spacing:2px;font-weight:700;cursor:pointer;
 clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
#log{width:100%;max-width:600px;display:flex;flex-direction:column;gap:10px}
.m{padding:10px 14px;max-width:92%;position:relative;line-height:1.3;background:#04162acc;backdrop-filter:blur(4px)}
.m::before{display:block;font-family:"Orbitron",sans-serif;font-size:.55rem;letter-spacing:3px;margin-bottom:3px;opacity:.8}
.j{align-self:flex-start;border-left:3px solid var(--c);box-shadow:0 0 14px #22d3ee22}
.j::before{content:"JUNIOR";color:#22d3ee}
.t{align-self:flex-end;border-right:3px solid var(--m);text-align:right;box-shadow:0 0 14px #f472b622}
.t::before{content:"TU";color:#f472b6}
.m a{color:#67e8f9}
</style>

window.onerror=function(m,s,l){var e=document.getElementById("err");if(e){e.style.display="block";e.textContent="Errore: "+m+" (riga "+l+")";}};

<div class="hud"><span><span class="dot"></span>SISTEMA <b>ONLINE</b></span><span id="clock">--:--:--</span></div>
<h1>JUNIOR</h1>
<div class="ver">ASSISTENTE VOCALE · v9</div>
<p class="sub">Tocca il nucleo e chiedimi qualsiasi cosa: “Junior, chi era Napoleone?”</p>
<div class="core">
  <div class="ring r4"></div><div class="ring r3"></div><div class="ring r2"></div><div class="ring r1"></div>
  <button id="orb">AVVIA</button>
</div>
<div id="modo">STANDBY</div>
<div id="stato"></div>
<div class="chips">
  <button class="chip" data-c="che ore sono">⏰ ORA</button>
  <button class="chip" data-c="che tempo fa a Roma">🌦️ METEO</button>
  <button class="chip" data-c="dimmi una curiosità">💡 CURIOSITÀ</button>
  <button class="chip" data-c="raccontami una barzelletta">😂 BARZELLETTA</button>
  <button class="chip" data-c="tira un dado">🎲 DADO</button>
  <button class="chip" id="test">🔊 TEST VOCE</button>
</div>
<div class="riga"><input id="testo" placeholder="Scrivi un comando…"><button id="invia">INVIA</button></div>
<div id="log"></div>
<script>
var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
var $=function(i){return document.getElementById(i);};
var orb=$("orb"),stato=$("stato"),logEl=$("log");
var rec=null,running=false,speaking=false,attesaFn=null,occupato=false,svegliaFino=0,timerFine=null,ultimaAttivita=0,ultimo=null;
var GIORNI=["domenica","lunedì","martedì","mercoledì","giovedì","venerdì","sabato"];
var MESI=["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];
var BARZ=["Sai perché il computer va dal dottore? Perché ha un virus!","Qual è il colmo per un elettricista? Non avere corrente di pensiero!","Cosa fa un gatto in autostrada? Il gatto di marcia!","Perché il pomodoro non riesce a dormire? Perché ha la pelle rossa e il sugo agitato!"];
var ETICHETTE={idle:"STANDBY",ascolto:"ASCOLTO IN CORSO",parla:"TRASMISSIONE VOCALE"};
var STOP=["il","lo","la","l","i","gli","le","un","una","uno","di","a","da","in","con","su","per","tra","fra","e","è","che","chi","cosa","come","quando","dove","perché","quale","quali","quanto","quanti","mi","ti","si","sono","era","dei","del","della","delle","dello","degli","nel","nella","nei","al","alla","ai","ho","ha","fa","fanno","può","puoi","dimmi","spiegami","parlami","sapere","vorrei","voglio","sai","dire","funziona","funzionano","fatto","fatta"];

function setMode(m){document.body.setAttribute("data-mode",m);$("modo").textContent=ETICHETTE[m]||"";}
function stat(t){stato.textContent=t;}
function pota(){while(logEl.children.length>8)logEl.removeChild(logEl.lastChild);}
function agg(t,c){var d=document.createElement("div");d.className="m "+c;d.textContent=t;logEl.insertBefore(d,logEl.firstChild);pota();}
function link(testo,url){var d=document.createElement("div");d.className="m j";var a=document.createElement("a");a.href=url;a.target="_blank";a.rel="noopener";a.textContent="🔗 "+testo;d.appendChild(a);logEl.insertBefore(d,logEl.firstChild);pota();}

function tick(){var d=new Date();$("clock").textContent=("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2)+":"+("0"+d.getSeconds()).slice(-2);}
tick();setInterval(tick,1000);

function scegliVoce(){
  var vs=speechSynthesis.getVoices().filter(function(x){return x.lang.replace("_","-").toLowerCase().indexOf("it")===0;});
  var pref=["luca","giorgio","diego","cosimo"];
  for(var i=0;i<pref.length;i++){for(var j=0;j<vs.length;j++){if(vs[j].name.toLowerCase().indexOf(pref[i])>=0)return vs[j];}}
  return vs[0];
}

function fermaRec(){
  if(rec){rec.onstart=null;rec.onresult=null;rec.onend=null;rec.onerror=null;try{rec.abort();}catch(e){}rec=null;}
}

function parla(t){
  occupato=false;
  agg(t,"j");speaking=true;setMode("parla");stat("Junior sta parlando…");
  fermaRec();
  var u=new SpeechSynthesisUtterance(t);u.lang="it-IT";
  var v=scegliVoce();if(v)u.voice=v;
  u.pitch=1.3;u.rate=1.08;u.volume=1;
  var done=false;
  var fine=function(){
    if(done)return;done=true;clearTimeout(timerFine);
    speaking=false;svegliaFino=Date.now()+20000;
    if(running){setMode("ascolto");setTimeout(avvia,500);}else{setMode("idle");}
  };
  u.onend=fine;
  u.onerror=function(e){
    if(e&&e.error&&e.error!=="interrupted"&&e.error!=="canceled")stat("Errore voce: "+e.error+" (controlla volume e tasto silenzioso)");
    fine();
  };
  clearTimeout(timerFine);
  timerFine=setTimeout(fine,Math.max(3500,t.length*95+3000));
  try{speechSynthesis.cancel();speechSynthesis.speak(u);speechSynthesis.resume();}catch(e){stat("Errore voce: "+e.message);fine();}
}

/* ---------- INTERNET ---------- */
function keywords(q){
  return q.toLowerCase().split(/[^a-zàèéìòóù0-9]+/).filter(function(w){return w&&w.length>1&&STOP.indexOf(w)<0;}).join(" ");
}

function pulisciTesto(t){
  return t.replace(/\([^)]*\)/g,"").replace(/\[[^\]]*\]/g,"")
   .replace(/\ba\.\s?C\./g,"avanti Cristo").replace(/\bd\.\s?C\./g,"dopo Cristo")
   .replace(/\b([A-ZÀ-Ý])\.\s?/g,"$1 ").replace(/\s+/g," ").trim();
}

function dividi(t){
  t=pulisciTesto(t);
  var m=t.match(/[^.!?]+[.!?]+(?=\s|$)/g);
  if(!m)return t?[t]:[];
  return m.map(function(s){return s.trim();}).filter(Boolean);
}

function leggi(){
  var u=ultimo,out="",n=0;
  while(u.i<u.f.length&&n<4&&(n===0||out.length+u.f[u.i].length<520)){out+=(out?" ":"")+u.f[u.i];u.i++;n++;}
  if(u.i<u.f.length)out+=" Se vuoi saperne di più, di’ continua.";
  return out;
}

function wikiTenta(q){
  var url="https://it.wikipedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrsearch="+encodeURIComponent(q)+"&gsrlimit=5&prop=extracts&exintro=1&explaintext=1&exlimit=max";
  return fetch(url).then(function(r){return r.json();}).then(function(d){
    if(!d.query||!d.query.pages)return null;
    var ps=Object.keys(d.query.pages).map(function(k){return d.query.pages[k];}).filter(function(p){return p.extract&&p.extract.length>40;});
    if(!ps.length)return null;
    var kw=keywords(q).split(" ").filter(Boolean);
    ps.forEach(function(p){
      var ti=p.title.toLowerCase(),ex=p.extract.toLowerCase(),s=0;
      kw.forEach(function(w){if(ti.indexOf(w)>=0)s+=3;else if(ex.indexOf(w)>=0)s+=1;});
      if(/può (riferirsi|indicare|significare)|può essere/.test(ex.slice(0,200)))s-=4;
      s-=(p.index||0)*0.1;
      p._s=s;
    });
    ps.sort(function(a,b){return b._s-a._s;});
    return ps[0];
  });
}

function pulisci(c){
  return c
   .replace(/^(per favore|dimmi|puoi dirmi|sai dirmi|mi dici|dammi informazioni su|parlami di|raccontami di|raccontami|spiegami|cerca|cercami)\s+/,"")
   .replace(/^(come funziona(no)?|come si (fa|fanno|prepara|preparano|chiama|chiamano)|chi (è|era|sono|erano)|che cos['’]è|cos['’]è|cosa (è|sono)|che cosa (è|sono)|cosa significa|che significa|cosa vuol dire|qual è|quale è|quali sono|dove si trova|dov['’]è|di cosa si tratta|perché|quando (è|era|nacque|morì))\s+/,"")
   .replace(/^(il|lo|la|l['’]|un|una|i|gli|le)\s*/,"")
   .replace(/[?!.]+$/,"").trim();
}

function rispondiWeb(c){
  var q=pulisci(c);if(!q)q=c;
  occupato=true;stat("Cerco online: "+q+"…");
  var tentativi=[q],k=keywords(q);
  if(k&&k!==q)tentativi.push(k);
  var i=0;
  function trovato(p){
    ultimo={t:p.title,f:dividi(p.extract),i:0};
    link("Leggi di più: "+p.title,"https://it.wikipedia.org/wiki/"+encodeURIComponent(p.title.replace(/ /g,"_")));
    parla("Ecco cosa ho trovato su "+p.title+". "+leggi());
  }
  function fallimento(){
    link("Cerca su Google: "+q,"https://www.google.com/search?q="+encodeURIComponent(q));
    parla("Non ho trovato nulla di preciso su "+q+". Prova a chiedermelo con altre parole, o con il nome esatto.");
  }
  function prova(){
    if(i>=tentativi.length)return fallimento();
    return wikiTenta(tentativi[i++]).then(function(p){return p?trovato(p):prova();});
  }
  prova().catch(function(){parla("Non riesco a collegarmi a internet.");});
}

function curiosita(){
  occupato=true;stat("Cerco una curiosità…");
  fetch("https://it.wikipedia.org/api/rest_v1/page/random/summary").then(function(r){return r.json();}).then(function(d){
    ultimo={t:d.title,f:dividi(d.extract||""),i:0};
    link("Leggi di più: "+d.title,"https://it.wikipedia.org/wiki/"+encodeURIComponent(d.title.replace(/ /g,"_")));
    parla("Lo sapevi? "+d.title+". "+leggi());
  }).catch(function(){parla("Non riesco a collegarmi a internet.");});
}

function descr(k){
  if(k===0)return "cielo sereno";
  if(k<=2)return "poco nuvoloso";
  if(k===3)return "cielo coperto";
  if(k===45||k===48)return "nebbia";
  if(k>=51&&k<=57)return "pioggerella";
  if(k>=61&&k<=67)return "pioggia";
  if(k>=71&&k<=77)return "neve";
  if(k>=80&&k<=82)return "rovesci";
  if(k>=95)return "temporale";
  return "tempo variabile";
}

function meteo(citta){
  occupato=true;stat("Controllo il meteo a "+citta+"…");
  fetch("https://geocoding-api.open-meteo.com/v1/search?name="+encodeURIComponent(citta)+"&count=1&language=it&format=json")
  .then(function(r){return r.json();}).then(function(g){
    if(!g.results||!g.results.length){return parla("Non trovo la città "+citta+".");}
    var p=g.results[0];
    return fetch("https://api.open-meteo.com/v1/forecast?latitude="+p.latitude+"&longitude="+p.longitude+"&current=temperature_2m,weather_code,wind_speed_10m&timezone=auto")
    .then(function(r){return r.json();}).then(function(w){
      var k=w.current;
      parla("A "+p.name+" la temperatura è di "+Math.round(k.temperature_2m)+" gradi, "+descr(k.weather_code)+". Vento a "+Math.round(k.wind_speed_10m)+" chilometri orari.");
    });
  }).catch(function(){parla("Non riesco a controllare il meteo, forse manca internet.");});
}

function calcola(c){
  var s=c.replace(/quanto fa|quanto viene|calcola|fammi il calcolo di|quant['’]è/g,"")
   .replace(/\bpiù\b/g,"+").replace(/\bmeno\b/g,"-").replace(/\b(diviso|fratto)\b/g,"/").replace(/\b(per|volte|x)\b/g,"*")
   .replace(/(\d)\s*,\s*(\d)/g,"$1.$2").replace(/\s+/g,"");
  if(!/^[\d+\-*\/().]+$/.test(s)||!/[+\-*\/]/.test(s)||!/\d/.test(s))return null;
  try{var r=Function('"use strict";return ('+s+')')();if(typeof r==="number"&&isFinite(r))return Math.round(r*1e6)/1e6;}catch(e){}
  return null;
}

/* ---------- COMANDI ---------- */
function esegui(c,silenzioso){
  var o=new Date(),m;
  c=c.trim();if(!c)return;
  if(/^(continua|vai avanti|prosegui|dimmi di più|di più|altro|ancora)$/.test(c)&&ultimo&&ultimo.i<ultimo.f.length)return parla(leggi());
  if(silenzioso&&c.split(" ").length<2)return;
  if(/\b(esci|stop|spegniti|arrivederci)\b/.test(c)){running=false;orb.textContent="AVVIA";parla("Ok, a dopo! Chiamami quando vuoi.");return;}
  if(/^(ciao|ehi|hey|salve)\b/.test(c))return parla("Ehi! Che si dice? Dimmi tutto!");
  if(/come stai/.test(c))return parla("Alla grande! Sono carico a mille. E tu?");
  if(/come ti chiami|chi sei/.test(c))return parla("Sono Junior, il tuo assistente vocale. Il più figo in circolazione!");
  if(/\bgrazie\b/.test(c))return parla("Figurati! Quando vuoi.");
  if(/che ore sono|che ora è/.test(c))return parla("Sono le "+o.getHours()+" e "+("0"+o.getMinutes()).slice(-2)+". Il tempo vola!");
  if(/che giorno|data di oggi/.test(c))return parla("Oggi è "+GIORNI[o.getDay()]+" "+o.getDate()+" "+MESI[o.getMonth()]+" "+o.getFullYear());
  if(/\bbarzelletta\b/.test(c))return parla(BARZ[Math.floor(Math.random()*BARZ.length)]);
  if(/\bdado\b/.test(c))return parla("Ho tirato il dado ed è uscito "+(Math.floor(Math.random()*6)+1)+"!");
  if(/\bmoneta\b/.test(c))return parla(Math.random()<0.5?"Testa!":"Croce!");
  if(/curiosit|sapevi che|qualcosa di interessante/.test(c))return curiosita();
  if(/apri youtube/.test(c)){link("Apri YouTube","https://www.youtube.com");return parla("Ecco YouTube! Tocca il link.");}
  m=c.match(/^(riproduci|metti|suona)\s+(.+)/);
  if(m){link("Cerca "+m[2]+" su YouTube","https://www.youtube.com/results?search_query="+encodeURIComponent(m[2]));return parla("Ti cerco "+m[2]+" su YouTube! Tocca il link.");}
  m=c.match(/^(?:cerca|cercami)\s+(?:su\s+)?google\s+(.+)/);
  if(m){link("Cerca "+m[1]+" su Google","https://www.google.com/search?q="+encodeURIComponent(m[1]));return parla("Ecco la ricerca su Google! Tocca il link.");}

  var cc=c.replace(/\bun(a)?\s+(?=(second|minut|or))/,"1 ");
  m=cc.match(/(\d+)\s*(second|minut|or)/);
  if(/timer|conto alla rovescia|sveglia/.test(c)&&m){
    var n=+m[1],u=m[2],ms=n*(u==="second"?1000:u==="minut"?60000:3600000);
    var nome=n+(u==="second"?" secondi":u==="minut"?" minuti":" ore");
    setTimeout(function(){parla("Ehi! Il timer da "+nome+" è scaduto!");},ms);
    return parla("Ok, timer da "+nome+" partito! Tieni la pagina aperta.");
  }

  if(/\b(meteo|tempo fa|temperatura|piove|previsioni)\b/.test(c)){
    var mm=c.match(/(?:meteo|tempo|temperatura|piove|previsioni).*?\b(?:a|ad|di|in|per|su)\s+(.+?)(?:\s+(?:oggi|adesso|ora|domani|stasera))?$/);
    var citta=mm?mm[1]:null;
    if(!citta){var x=c.match(/^(?:meteo|previsioni)\s+(.+)/);if(x)citta=x[1];}
    if(!citta){
      attesaFn=function(t){meteo(t.replace(/^(a|ad|di|in)\s+/,""));};
      return parla("Di quale città vuoi il meteo?");
    }
    return meteo(citta);
  }

  var r=calcola(c);
  if(r!==null)return parla("Fa "+String(r).replace(".",","));

  rispondiWeb(c);
}

function elabora(t){
  if(occupato)return;
  agg(t,"t");
  if(attesaFn){var f=attesaFn;attesaFn=null;return f(t);}
  var m=t.match(/giunior|iunior|juniore|junior/);
  if(m){
    var c=t.slice(m.index+m[0].length).replace(/^[\s,.]+/,"");
    if(!c){attesaFn=esegui;parla("Dimmi!");}else esegui(c);
  }else if(Date.now()<svegliaFino){
    esegui(t,true);
  }
}

function avvia(){
  if(!running||speaking||occupato)return;
  fermaRec();
  try{
    rec=new SR();rec.lang="it-IT";rec.continuous=false;rec.interimResults=true;
    ultimaAttivita=Date.now();
    rec.onstart=function(){
      ultimaAttivita=Date.now();setMode("ascolto");
      stat(Date.now()<svegliaFino?"Ti ascolto… continua pure, senza dire “Junior”":"In ascolto… di’ “Junior”");
    };
    rec.onresult=function(ev){
      ultimaAttivita=Date.now();
      if(speaking||occupato)return;
      for(var i=ev.resultIndex;i<ev.results.length;i++){
        var t=ev.results[i][0].transcript.toLowerCase().trim();
        if(ev.results[i].isFinal)elabora(t);else stat("Sento: "+t);
      }
    };
    rec.onend=function(){if(running&&!speaking&&!occupato)setTimeout(avvia,300);};
    rec.onerror=function(e){
      var msg=null;
      if(e.error==="service-not-allowed")msg="Attiva la dettatura: Impostazioni > Generali > Tastiera > Abilita dettatura (e controlla che Siri sia attivo).";
      else if(e.error==="not-allowed")msg="Microfono bloccato. Consenti il microfono per questo sito nelle impostazioni di Safari.";
      else if(e.error==="network")msg="Serve una connessione internet.";
      if(msg){stat(msg);running=false;setMode("idle");orb.textContent="AVVIA";}
    };
    rec.start();
  }catch(e){stat("Microfono: "+e.message);}
}

setInterval(function(){
  if(running&&!speaking&&!occupato&&Date.now()-ultimaAttivita>8000)avvia();
},2000);

orb.addEventListener("click",function(){
  try{var u=new SpeechSynthesisUtterance(" ");u.volume=0;speechSynthesis.speak(u);}catch(e){}
  if(!SR){stat("Questo browser non supporta il riconoscimento vocale. Usa Safari o Chrome.");return;}
  if(running){running=false;fermaRec();setMode("idle");orb.textContent="AVVIA";stat("");return;}
  running=true;orb.textContent="STOP";
  avvia();
});

$("test").addEventListener("click",function(){parla("Yo! Sono Junior. Se mi senti, la voce funziona alla grande!");});
$("invia").addEventListener("click",function(){var v=$("testo").value.toLowerCase().trim();if(v){agg(v,"t");$("testo").value="";esegui(v.replace(/^junior[\s,.]*/,""));}});
var chips=document.querySelectorAll(".chip[data-c]");
for(var k=0;k<chips.length;k++){chips[k].addEventListener("click",function(){esegui(this.getAttribute("data-c"));});}
if(window.speechSynthesis)speechSynthesis.getVoices();
</script>
